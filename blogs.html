    --ink:      #1F2933;

  a.blog-post, a.blog-post:visited, a.blog-post:hover { color:inherit; text-decoration:none; }

  .blog-post:hover {
    border-left-color:var(--tan-dark);

  }

  .blog-title {
    display:block;
    margin:0 0 2px;
    font-size:1.25em;
    font-weight:700;
    line-height:1.3;
    color:var(--ink);

  .blog-date {
    display:block;
    font-size:0.9em;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--tan-dark);
    margin-bottom:4px;
  }

  .blog-summary {
    display:block;
    font-size:1em;
    line-height:1.45;
